<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <!-- フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
      
    <link rel="stylesheet" href="system.css">
    <title>蒼來サバイバル</title>
</head>
<body>
<div class="gamebody">
    <h1>そうらいサバイバル</h1>

    <p>日数: <span id="day">1</span>日目</p>
    <p>体力: <span id="hp">100</span></p>



    <h2 id="foodName"></h2>

    <img class="foodimg" id="foodImage" src="" width="200">

    <p>危険度: <span id="risk"></span>%</p>

    <button id="eatBtn" onclick="eat()">たべる</button>
    <button id="skipBtn" onclick="skip()">たべない</button>
    <button id="nextBtn" onclick="nextDay()" style="display:none;">次の日へ</button>
    
    <a href="game.html">リスタート</a>
    <p id="message"></p>
</div>

<script src="system.js"></script>

</body>
</html>
