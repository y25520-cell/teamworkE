<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <!-- フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
      
    <link rel="stylesheet" href="system.css">
    <title>蒼來サバイバル</title>
</head>
<body>
    <div class="totan">
        <a class="home" href="index.html">ホーム</a>
        <a class="restart" href="game.html">リスタート</a>
        <a class="zukanb" href="zukan.html">図鑑</a>
    </div>

    <h1>そうらいサバイバル</h1>
    <div class="data">
        <p>日数: <span id="day">1</span>日目</p>
        <p>体力: <span id="hp">50</span></p>
        <p>最高記録: <span id="highScore">0</span>日</p>
        
    </div>

    <div class="gamebody">
            <h2 id="foodName"></h2>

            <img class="foodimg" id="foodImage" src="" width="200">
            <img id="souraiimg" src="img/taiki.png" alt="" height="200">

            <p class="risk">危険度: <span id="risk"></span>%</p>

            <button id="eatBtn" onclick="eat()">たべる</button>
            <button id="skipBtn" onclick="skip()">たべない</button>

            <button id="nextBtn" onclick="nextDay()" style="display:none;">次の日へ</button>
            
            <p id="message"></p>

    </div>

    <script src="/js/foods.js"></script>
    <script src="/js/system.js"></script>

</body>

</html>
